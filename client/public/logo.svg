<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="url(#gradient1)" stroke="white" stroke-width="2"/>
  
  <!-- Tic-tac-toe grid -->
  <g stroke="white" stroke-width="2" stroke-linecap="round">
    <!-- Vertical lines -->
    <line x1="13.33" y1="8" x2="13.33" y2="32"/>
    <line x1="26.67" y1="8" x2="26.67" y2="32"/>
    <!-- Horizontal lines -->
    <line x1="8" y1="13.33" x2="32" y2="13.33"/>
    <line x1="8" y1="26.67" x2="32" y2="26.67"/>
  </g>
  
  <!-- X marks -->
  <g stroke="white" stroke-width="2.5" stroke-linecap="round">
    <line x1="10" y1="10" x2="16.67" y2="16.67"/>
    <line x1="16.67" y1="10" x2="10" y2="16.67"/>
    <line x1="23.33" y1="23.33" x2="30" y2="30"/>
    <line x1="30" y1="23.33" x2="23.33" y2="30"/>
  </g>
  
  <!-- O mark -->
  <circle cx="20" cy="20" r="3.5" fill="none" stroke="white" stroke-width="2.5"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
